services:
  - type: web
    name: trading-performance-tracker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trading-db
          property: connectionString
      - key: INITIAL_BALANCE
        value: "10.0"
      - key: TARGET_BALANCE
        value: "100.0"
      - key: MAX_DAILY_SETUPS
        value: "2"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

databases:
  - name: trading-db
    plan: free
    databaseName: trading_tracker
    user: trader
